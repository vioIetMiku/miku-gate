name: verify
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
permissions:
  contents: read
jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Verify frontend
        run: |
          npm --prefix web run format:check
          npm --prefix web test
          npm --prefix web run build
      - name: Verify installation planner and VPS lab guards without privilege
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify Go
        run: |
          go vet ./...
          go test -race ./...
          go build -trimpath -o bin/miku-gate ./cmd/miku-gate
      - name: Exercise real HTTP server and CLI
        run: node scripts/smoke.mjs
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm --prefix web run test:e2e
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-evidence
          path: |
            artifacts/*.png
            .cache/playwright-results/
          if-no-files-found: ignore
