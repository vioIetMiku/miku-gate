name: Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      refresh_v027:
        description: Rebuild existing v0.2.7 assets after all checks (no new tag or release)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            compat/miku-export/go.sum
      - name: Resolve stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "${GITHUB_REF#refs/tags/}" == "v$version" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check shell and Python syntax
        run: |
          for script in install.sh install-online.sh install-docker.sh mikugate.sh scripts/*.sh docker/*.sh; do bash -n "$script"; done
          python3 -m compileall -q scripts docker
      - name: Offline Go regression tests and vet
        run: |
          go test -race -c -o /tmp/miku-gate-tests ./src
          sudo /tmp/miku-gate-tests -test.count=1 -test.timeout=5m
          go vet ./...
          (cd compat/miku-export && go test ./... && go vet ./...)
      - name: Offline installer regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          cd scripts
          sudo env MIKU_NGINX=/usr/sbin/nginx python3 -B -m unittest -v test_maintenance test_bootstrap test_quick test_ports test_docker test_frontend test_frontend_lifecycle test_build_key test_console test_inbound_wizard test_install_lifecycle
      - name: Check Go formatting
        run: test -z "$(gofmt -l src)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DOM interaction regression tests
        run: |
          npm install --prefix "$RUNNER_TEMP/miku-ui" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          MIKU_UI_OUTPUT="$RUNNER_TEMP/miku-ui-fixture" go test ./src -run '^TestPanelBrowserFixture$' -count=1
          MIKU_JSDOM_MODULE="$RUNNER_TEMP/miku-ui/node_modules/jsdom" node scripts/test-ui.cjs "$RUNNER_TEMP/miku-ui-fixture/index.html"
          python3 -B scripts/export-frontend.py
          MIKU_JSDOM_MODULE="$RUNNER_TEMP/miku-ui/node_modules/jsdom" node scripts/test-ui.cjs frontend/public/index.html
      - name: Build both architectures from source
        run: python3 scripts/build-release.py --version '${{ steps.version.outputs.version }}' --label 'v${{ steps.version.outputs.version }}' --output dist
      - name: Verify release archives and embedded version
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          bash dist/miku --verify
          mkdir -m 700 smoke
          tar --no-same-owner -xzf "dist/miku-gate-vps-v${{ steps.version.outputs.version }}.tar.gz" -C smoke
          [[ "$(smoke/miku-gate/bin/miku-linux-amd64 -version)" == 'Miku Gate ${{ steps.version.outputs.version }}' ]]
          python3 -m zipfile -t "dist/miku-gate-v${{ steps.version.outputs.version }}.zip"
      - name: Docker build, startup and persistent credentials smoke test
        shell: bash
        working-directory: smoke/miku-gate
        run: |
          set -euo pipefail
          [[ -c /dev/net/tun ]] || sudo modprobe tun
          docker compose config --quiet
          bash install-docker.sh build
          trap 'if [[ -f compose.yaml ]]; then docker compose logs --tail=80 miku; docker compose -f compose.frontend.yaml down; docker compose down; fi; kill "$busy_ports_pid" 2>/dev/null || true' EXIT
          # Both default ports are intentionally busy: startup must auto-fallback.
          python3 -u -c 'import socket,time; holders=[]; [(holders.append(socket.socket()), holders[-1].bind(("0.0.0.0", port)), holders[-1].listen()) for port in (8899,8900)]; print("ports held",flush=True); time.sleep(900)' > "$RUNNER_TEMP/miku-busy-ports.log" 2>&1 &
          busy_ports_pid=$!
          sleep 1
          kill -0 "$busy_ports_pid"
          # Backend bootstrap creates root-owned private bind directories; do
          # not create them as the ordinary GitHub runner user.
          backend_info=$(sudo bash install-docker.sh backend up)
          [[ "$backend_info" == *'复用本地镜像'* ]]
          [[ "$backend_info" == *'访问口令：'* ]]
          [[ "$backend_info" == *'快捷菜单'* ]]
          unset backend_info
          [[ "$(stat -c %u docker-data)" == 0 ]]
          [[ "$(stat -c %a docker-data)" == 700 ]]
          docker compose exec -T miku miku status
          before=$(docker compose exec -T miku sha256sum /var/lib/miku/password /var/lib/miku/basepath)
          docker compose stop miku
          docker compose up -d --force-recreate --wait --wait-timeout 180
          after=$(docker compose exec -T miku sha256sum /var/lib/miku/password /var/lib/miku/basepath)
          [[ "$before" == "$after" ]]
          sudo python3 -B scripts/frontend.py start
          base=$(sudo cat docker-data/basepath)
          port=$(sudo python3 -c 'import json; print(json.load(open("frontend/.runtime/state.json"))["port"])')
          backend_port=$(sudo python3 -c 'import json; print(json.load(open("docker-data/settings.json"))["port"])')
          [[ "$port" != 8900 && "$port" != 8899 && "$port" != "$backend_port" ]]
          [[ "$backend_port" != 8899 && "$backend_port" != 8900 ]]
          frontend="http://127.0.0.1:$port/$base/"
          curl -fsS "$frontend" -o "$RUNNER_TEMP/frontend-login.html"
          grep -q 'static/login-2.js' "$RUNNER_TEMP/frontend-login.html"
          [[ "$(curl -s -o /dev/null -w '%{http_code}' "${frontend}api/jobs")" == 401 ]]
          password=$(sudo cat docker-data/password)
          # Exercise the installed HOST shortcut, not just the container binary.
          sudo miku info > "$RUNNER_TEMP/miku-cli-info.txt"
          sudo miku > "$RUNNER_TEMP/miku-cli-menu.txt"
          grep -q 'miku info' "$RUNNER_TEMP/miku-cli-menu.txt"
          sudo python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]).read_text(); assert "访问口令：" in p; assert pathlib.Path(sys.argv[2]).read_text().strip() in p' "$RUNNER_TEMP/miku-cli-info.txt" docker-data/password
          printf '%s' "$password" | curl -fsS -c "$RUNNER_TEMP/frontend.cookies" --data-urlencode password@- "${frontend}login"
          unset password
          curl -fsS -b "$RUNNER_TEMP/frontend.cookies" "$frontend" -o "$RUNNER_TEMP/frontend-index.html"
          grep -q 'static/index-2.js' "$RUNNER_TEMP/frontend-index.html"
          curl -fsS -b "$RUNNER_TEMP/frontend.cookies" "${frontend}api/jobs" -o "$RUNNER_TEMP/frontend-jobs.json"
          python3 -c 'import json,sys; assert isinstance(json.load(open(sys.argv[1])), list)' "$RUNNER_TEMP/frontend-jobs.json"
          [[ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://untrusted.example' -X POST "${frontend}login")" == 403 ]]
          config_before=$(sudo sha256sum frontend/.runtime/nginx.conf)
          sudo python3 -B scripts/frontend.py start
          [[ "$config_before" == "$(sudo sha256sum frontend/.runtime/nginx.conf)" ]]
          sudo python3 -B scripts/frontend.py stop
          docker compose exec -T miku miku status
          curl -fsS -b "$RUNNER_TEMP/frontend.cookies" "http://127.0.0.1:$backend_port/$base/api/jobs" -o /dev/null
          sudo python3 -B scripts/frontend.py start
          sudo python3 -B scripts/frontend.py info
          # Exercise both HOST menu uninstall modes on this disposable instance,
          # then restore from the same verified release bundle without new IDs.
          project="$PWD"
          sudo chown -R root:root "$project"
          preserved=$(sudo sha256sum docker-data/password docker-data/basepath docker-data/settings.json)
          printf 'YES\n' | sudo miku uninstall
          [[ ! -e scripts/docker_console.py && ! -e bin/miku-linux-amd64 ]]
          [[ ! -e /usr/local/bin/miku && ! -e /usr/local/bin/miku-docker ]]
          [[ "$preserved" == "$(sudo sha256sum docker-data/password docker-data/basepath docker-data/settings.json)" ]]
          sudo mkdir -m 700 "$RUNNER_TEMP/miku-restore"
          sudo tar --no-same-owner -xzf "$GITHUB_WORKSPACE/dist/miku-gate-vps-v${{ steps.version.outputs.version }}.tar.gz" -C "$RUNNER_TEMP/miku-restore"
          restored_info=$(sudo env MIKU_DOCKER_INSTALL_DIR="$project" bash "$RUNNER_TEMP/miku-restore/miku-gate/install.sh" --docker)
          [[ "$restored_info" == *'访问口令：'* && "$restored_info" == *'快捷菜单：miku'* ]]
          unset restored_info
          [[ "$preserved" == "$(sudo sha256sum docker-data/password docker-data/basepath docker-data/settings.json)" ]]
          docker compose exec -T miku miku status
          printf 'DELETE\n' | sudo miku purge
          [[ ! -e "$project" && ! -e /usr/local/bin/miku && ! -e /usr/local/bin/miku-docker ]]
          cd "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: miku-gate-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  refresh-v027:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-v0.2.7]')) || (github.event_name == 'workflow_dispatch' && inputs.refresh_v027))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: miku-gate-release
          path: dist
      - name: Back up existing release attachments and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(cat VERSION)" == 0.2.7 ]]
          [[ "$(gh release view v0.2.7 --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease]|all(. == false)')" == true ]]
          [[ "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.7 --jq .object.sha)" == 4ec7100cfd56d9d98cbaa016696a109560d8a1ce ]]
          [[ "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" == v0.2.7 ]]
          mkdir previous
          gh release download v0.2.7 --dir previous --pattern '*'
          gh release view v0.2.7 --json body --jq .body > previous/release-notes.md
          (cd previous && sha256sum -c SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          [[ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6 ]]
      - uses: actions/upload-artifact@v4
        with:
          name: v0.2.7-before-maintenance-${{ github.run_id }}
          path: previous/*
          retention-days: 30
          if-no-files-found: error
      - name: Refresh existing v0.2.7 assets and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          upload_set() {
            local dir="$1" file
            for file in "$dir"/*; do
              case "${file##*/}" in SHA256SUMS|release-notes.md) continue ;; esac
              gh release upload v0.2.7 "$file" --clobber
            done
            gh release upload v0.2.7 "$dir/SHA256SUMS" --clobber
          }
          restore_previous() {
            trap - ERR
            echo 'Refresh failed; restoring previous attachments.' >&2
            upload_set previous
            gh release edit v0.2.7 --notes-file previous/release-notes.md
          }
          trap restore_previous ERR
          upload_set dist
          mkdir verify
          gh release download v0.2.7 --dir verify --pattern '*'
          (cd verify && sha256sum -c SHA256SUMS)
          [[ "$(find verify -maxdepth 1 -type f | wc -l)" -eq 6 ]]
          cmp dist/SHA256SUMS verify/SHA256SUMS
          mkdir unpacked
          tar -xzf verify/miku-gate-vps-v0.2.7.tar.gz -C unpacked
          python3 -c 'import json,os; assert json.load(open("unpacked/miku-gate/BUILD.json"))["source"] == os.environ["GITHUB_SHA"]'
          cp scripts/release-notes.md maintenance-notes.md
          printf '\n同版本安装器维护更新：`%s`。修复安装进度漂移、重复标题、Docker 更新及快捷命令冲突，加入保留数据卸载和彻底卸载。版本和原标签保持不变；当前附件由上述提交构建。\n' "$GITHUB_SHA" >> maintenance-notes.md
          gh release edit v0.2.7 --notes-file maintenance-notes.md
          trap - ERR
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: miku-gate-release
          path: dist
      - name: Create draft, upload and verify attachments, then publish stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          (cd dist && sha256sum -c SHA256SUMS)
          if gh release view "$tag" --json isDraft --jq .isDraft > draft-state; then
            [[ "$(cat draft-state)" == true ]] || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$tag" --verify-tag --draft --title "Miku Gate $tag" --notes-file scripts/release-notes.md
          fi
          gh release upload "$tag" dist/* --clobber
          mkdir verify
          gh release download "$tag" --dir verify --pattern '*'
          (cd verify && sha256sum -c SHA256SUMS)
          [[ "$(find verify -maxdepth 1 -type f | wc -l)" -eq 6 ]]
          gh release edit "$tag" --draft=false --prerelease=false --latest --title "Miku Gate $tag" --notes-file scripts/release-notes.md
