name: Interactive installation and HTTPS lab (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installation-lab
  cancel-in-progress: false
jobs:
  install-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vpn: ['no', 'yes']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build actual CLI and HTTPS integration harness
        run: |
          npm ci --prefix web
          npm --prefix web run build
          mkdir -p .cache/installation-lab
          go build -trimpath -o .cache/installation-lab/miku-gate ./cmd/miku-gate
          go build -trimpath -ldflags="-s -w" -o .cache/installation-lab/miku-gate-upgrade ./cmd/miku-gate
          go test -c -o .cache/installation-lab/cli.test ./cmd/miku-gate
          go test -c -o .cache/installation-lab/core-runtime.test ./internal/coreruntime
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Stage root-owned independent CLI without changing existing services
        shell: bash
        run: |
          set -euo pipefail
          stage="/usr/local/lib/miku-install-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$stage"
          sudo install -d -m 755 "$stage"
          sudo install -m 555 .cache/installation-lab/miku-gate "$stage/miku-gate"
          sudo install -m 555 .cache/installation-lab/cli.test "$stage/cli.test"
          sudo install -m 555 .cache/installation-lab/core-runtime.test "$stage/core-runtime.test"
          sudo install -d -m 755 "$stage/bin" "$stage/scripts"
          sudo install -m 555 .cache/installation-lab/miku-gate "$stage/bin/miku-gate"
          for name in install-vps.sh miku-install.py miku-maintain.py; do
            sudo install -m 444 "scripts/$name" "$stage/scripts/$name"
          done
          python3 - "$stage" "$GITHUB_SHA" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          stage=Path(sys.argv[1]);binary=stage/'bin/miku-gate'
          meta={'format':1,'version':'v0.1.0-dev.11','source':sys.argv[2],'platform':'linux-amd64','binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'binary_bytes':binary.stat().st_size,'script_sha256':{name:hashlib.sha256((stage/'scripts'/name).read_bytes()).hexdigest() for name in ('install-vps.sh','miku-install.py','miku-maintain.py')}}
          Path('.cache/installation-lab/BUILD.json').write_text(json.dumps(meta))
          PY
          sudo install -m 444 .cache/installation-lab/BUILD.json "$stage/BUILD.json"
          sudo install -d -m 755 "$stage/upgrade" "$stage/upgrade/bin" "$stage/upgrade/scripts"
          sudo install -m 555 .cache/installation-lab/miku-gate-upgrade "$stage/upgrade/bin/miku-gate"
          for name in install-vps.sh miku-install.py miku-maintain.py; do
            sudo install -m 444 "scripts/$name" "$stage/upgrade/scripts/$name"
          done
          python3 - "$stage/upgrade" "$GITHUB_SHA" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          stage=Path(sys.argv[1]);binary=stage/'bin/miku-gate'
          meta={'format':1,'version':'v0.1.0-dev.11','source':sys.argv[2],'platform':'linux-amd64','binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'binary_bytes':binary.stat().st_size,'script_sha256':{name:hashlib.sha256((stage/'scripts'/name).read_bytes()).hexdigest() for name in ('install-vps.sh','miku-install.py','miku-maintain.py')}}
          Path('.cache/installation-lab/UPGRADE-BUILD.json').write_text(json.dumps(meta))
          PY
          sudo install -m 444 .cache/installation-lab/UPGRADE-BUILD.json "$stage/upgrade/BUILD.json"
          echo "MIKU_INSTALL_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Actual ordinary-user IP HTTPS CLI, Host Origin and Secure session
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --quiet --scope --collect --unit="miku-https-lab-$GITHUB_RUN_ID" \
            --property=CPUQuota=100% --property=MemoryMax=384M --property=MemorySwapMax=0 --property=TasksMax=64 \
            /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups --no-new-privs \
            /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 GOMAXPROCS=1 GOMEMLIMIT=128MiB \
            MIKU_GATE_MANAGEMENT_TEST=1 MIKU_GATE_BINARY="$MIKU_INSTALL_STAGE/miku-gate" \
            "$MIKU_INSTALL_STAGE/cli.test" -test.v -test.run '^TestLinuxManagementHTTPS(Domain)?CLI$' -test.timeout=45s \
            2>&1 | tee .cache/installation-lab/https-result.txt
      - name: Verify plan-only does not create installation resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('.cache/installation-lab/answers.json').write_text(json.dumps({'enable_vpn':'${{ matrix.vpn }}','install_dependencies':'yes','vps_ip':'192.0.2.10','use_domain':'no','management_port':'39443','managed_core':'both','confirm_ip_certificate':'yes','confirm_install':'yes','start_services':'yes','reuse_existing':'no'}))
          PY
          sha=$(sha256sum "$MIKU_INSTALL_STAGE/miku-gate" | cut -d' ' -f1)
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            sh "$MIKU_INSTALL_STAGE/scripts/install-vps.sh" \
              --plan-only --answers "$PWD/.cache/installation-lab/answers.json" | tee .cache/installation-lab/plan-result.txt
          test ! -e /usr/local/lib/miku-gate
          test ! -e /etc/miku-gate
          test ! -e /var/lib/miku-gate
          test ! -e /etc/systemd/system/miku-gate.service
      - name: Apply explicitly answered independent IP HTTPS install on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sha=$(sha256sum "$MIKU_INSTALL_STAGE/miku-gate" | cut -d' ' -f1)
          umask 077
          # Output contains the disposable one-time admin password: retain only a
          # private local file, never print or upload this initialization log.
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            sh "$MIKU_INSTALL_STAGE/scripts/install-vps.sh" \
              --answers "$PWD/.cache/installation-lab/answers.json" > .cache/installation-lab/private-install.log 2>&1
          chmod 600 .cache/installation-lab/private-install.log
          sudo systemctl is-active --quiet miku-gate.service
          sudo systemctl show miku-gate.service --property=User,NoNewPrivileges,MemoryMax,CPUQuotaPerSecUSec,MainPID \
            | tee .cache/installation-lab/service-result.txt
          sudo test -s /etc/miku-gate/install-state.json
          if [ "${{ matrix.vpn }}" = yes ]; then
            sudo systemctl is-active --quiet miku-gate-vpn.service
            instance=$(sudo "$MIKU_INSTALL_STAGE/miku-gate" instance --data=/var/lib/miku-gate/data)
            # Only capability/status metadata; no node connections or credentials.
            control_uid=$(id -u miku-gate)
            control_gid=$(id -g miku-gate)
            sudo setpriv --reuid="$control_uid" --regid="$control_gid" --clear-groups --no-new-privs \
              "$MIKU_INSTALL_STAGE/miku-gate" vpn-executor info --instance="$instance" \
              | tee .cache/installation-lab/vpn-service-result.txt
          fi
          echo 'Actual install coordinator and IP HTTPS health/fingerprint passed on disposable runner; ports80/443 and existing panels were not controlled. This step does not independently compare host network snapshots.'
      - name: Verify downloaded installed cores and runtime under the installed ordinary identity
        shell: bash
        run: |
          set -euo pipefail
          control_uid=$(id -u miku-gate)
          control_gid=$(id -g miku-gate)
          # Verify the installer's exact archive/member digest provenance, not a
          # separately staged example core. No usernames/passwords in this output.
          sudo python3 - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          state=json.loads(Path('/etc/miku-gate/install-state.json').read_text())
          assert len(state['core_sources'])==2
          for record in state['core_sources']:
              binary=Path('/usr/local/lib/miku-gate')/record['core']
              info=binary.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and not info.st_mode&0o022
              assert hashlib.sha256(binary.read_bytes()).hexdigest()==record['binary_sha256']
          print('Installed core provenance and immutable root ownership verified for two official fixed-version binaries.')
          PY
          sudo systemd-run --quiet --scope --collect --unit="miku-installed-core-lab-$GITHUB_RUN_ID" \
            --property=CPUQuota=100% --property=MemoryMax=384M --property=MemorySwapMax=0 --property=TasksMax=64 \
            /usr/bin/unshare --net /bin/sh -c '
              /usr/sbin/ip link set lo up
              exec /usr/bin/setpriv --reuid="$2" --regid="$3" --clear-groups --no-new-privs \
                /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C LC_ALL=C GOMAXPROCS=1 GOMEMLIMIT=128MiB \
                MIKU_GATE_INGRESS_TEST=1 MIKU_GATE_XRAY=/usr/local/lib/miku-gate/xray MIKU_GATE_SINGBOX=/usr/local/lib/miku-gate/sing-box \
                "$1/core-runtime.test" -test.v -test.run "^TestLinuxManagedNativeRuntime$" -test.timeout=60s
            ' sh "$MIKU_INSTALL_STAGE" "$control_uid" "$control_gid" \
            2>&1 | tee .cache/installation-lab/installed-core-runtime.txt
      - name: Verify confidential paired backup, installed upgrade and rollback
        shell: bash
        run: |
          set -euo pipefail
          # Neither archive nor initialization log is published. Only closed
          # boolean assertions are uploaded; only installed same-instance assertions are retained.
          sudo python3 -B scripts/verify-installed-backup.py \
            --private-init-log "$PWD/.cache/installation-lab/private-install.log" \
            --maintenance-script /usr/local/lib/miku-gate/miku-maintain.py \
            --upgrade-distribution "$MIKU_INSTALL_STAGE/upgrade" \
            --output /var/backups/miku-gate-ci-private/snapshot.tar.gz \
            2>&1 | tee .cache/installation-lab/backup-result.txt
      - name: Retain bounded non-secret assertion output only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-https-evidence-vpn-${{ matrix.vpn }}
          path: |
            .cache/installation-lab/https-result.txt
            .cache/installation-lab/plan-result.txt
            .cache/installation-lab/service-result.txt
            .cache/installation-lab/vpn-service-result.txt
            .cache/installation-lab/installed-core-runtime.txt
            .cache/installation-lab/backup-result.txt
          if-no-files-found: warn
          retention-days: 14
