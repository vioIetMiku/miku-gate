name: Certificate refresh CLI (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: certificate-lab
  cancel-in-progress: false
jobs:
  domain-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build actual embedded CLI and targeted domain harness
        run: |
          npm ci --prefix web
          npm --prefix web run build
          mkdir -p .cache/certificate-lab
          go build -trimpath -o .cache/certificate-lab/miku-gate ./cmd/miku-gate
          go test -c -o .cache/certificate-lab/cli.test ./cmd/miku-gate
      - name: Run new stopped-domain-certificate refresh with ordinary UID
        shell: bash
        run: |
          set -euo pipefail
          stage="/usr/local/lib/miku-certificate-lab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$stage"
          sudo install -d -m 755 "$stage"
          sudo install -m 555 .cache/certificate-lab/miku-gate "$stage/miku-gate"
          sudo install -m 555 .cache/certificate-lab/cli.test "$stage/cli.test"
          sudo systemd-run --quiet --scope --collect --unit="miku-certificate-lab-$GITHUB_RUN_ID" \
            --property=CPUQuota=100% --property=MemoryMax=384M --property=MemorySwapMax=0 --property=TasksMax=64 \
            /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups --no-new-privs \
            /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 GOMAXPROCS=1 GOMEMLIMIT=128MiB \
            MIKU_GATE_MANAGEMENT_TEST=1 MIKU_GATE_BINARY="$stage/miku-gate" \
            "$stage/cli.test" -test.v -test.run '^TestLinuxManagementHTTPSDomainCLI$' -test.timeout=45s \
            2>&1 | tee .cache/certificate-lab/assertions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificate-refresh-assertions
          path: .cache/certificate-lab/assertions.txt
          retention-days: 14
