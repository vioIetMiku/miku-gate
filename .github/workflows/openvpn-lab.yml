name: Controlled OpenVPN lab (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controlled-openvpn-lab
  cancel-in-progress: false
jobs:
  controlled-tunnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install official distribution packages on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn iproute2 nftables util-linux time
      - name: Build tests as an ordinary user
        run: |
          mkdir -p .cache
          go test -c -o .cache/openvpn-linux.test ./internal/tunnel
      - name: Record non-secret environment and source version
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Source: '; git rev-parse HEAD
            uname -srm
            cat /etc/os-release
            go version
            openvpn --version
            ip -Version
            nft --version
            nsenter --version
            printf '
Only disconnected laboratory namespaces are used; no public VPN targets or user VPS.
'
          } | tee .cache/openvpn-environment.txt
      - name: Verify controlled TLS tunnel, bound DNS and fail-closed traffic
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --quiet --scope --collect \
            --unit="miku-openvpn-lab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --property=CPUQuota=100% --property=MemoryMax=512M \
            --property=MemorySwapMax=0 --property=TasksMax=64 \
            /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C LC_ALL=C \
              MIKU_GATE_OPENVPN_TEST=1 GOMAXPROCS=1 GOMEMLIMIT=256MiB \
              /usr/bin/time -v "$PWD/.cache/openvpn-linux.test" \
                -test.v -test.parallel 1 -test.run '^TestLinuxOpenVPN' -test.timeout 3m \
            2>&1 | tee .cache/openvpn-result.txt
      - name: Save environment and assertion evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-openvpn-evidence
          path: |
            .cache/openvpn-environment.txt
            .cache/openvpn-result.txt
          if-no-files-found: warn
          retention-days: 14
