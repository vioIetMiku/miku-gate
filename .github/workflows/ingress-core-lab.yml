name: Existing encrypted ingress core lab (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: existing-ingress-core-lab
  cancel-in-progress: false
jobs:
  ingress-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download exact official cores with pinned SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/ingress-lab
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o .cache/ingress-lab/xray.zip
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz -o .cache/ingress-lab/sing-box.tar.gz
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  .cache/ingress-lab/xray.zip' | sha256sum -c -
          echo 'e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  .cache/ingress-lab/sing-box.tar.gz' | sha256sum -c -
          unzip -p .cache/ingress-lab/xray.zip xray > .cache/ingress-lab/xray
          tar -xOf .cache/ingress-lab/sing-box.tar.gz sing-box-1.14.3-linux-amd64/sing-box > .cache/ingress-lab/sing-box
          chmod 755 .cache/ingress-lab/xray .cache/ingress-lab/sing-box
          go test -c -o .cache/ingress-lab/ingress.test ./internal/ingress
          go test -c -o .cache/ingress-lab/core-runtime.test ./internal/coreruntime
          git rev-parse HEAD
          .cache/ingress-lab/xray version
          .cache/ingress-lab/sing-box version
      - name: Run existing and generated TLS Vision/REALITY/Trojan through Miku SOCKS
        shell: bash
        run: |
          set -euo pipefail
          stage="/usr/local/lib/miku-ingress-lab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$stage"
          sudo install -d -m 755 "$stage"
          sudo install -m 555 .cache/ingress-lab/xray "$stage/xray"
          sudo install -m 555 .cache/ingress-lab/sing-box "$stage/sing-box"
          sudo install -m 555 .cache/ingress-lab/ingress.test "$stage/ingress.test"
          sudo install -m 555 .cache/ingress-lab/core-runtime.test "$stage/core-runtime.test"
          cleanup() {
            sudo rm -f -- "$stage/xray" "$stage/sing-box" "$stage/ingress.test" "$stage/core-runtime.test"
            sudo rmdir -- "$stage"
          }
          trap cleanup EXIT
          sudo systemd-run --quiet --scope --collect \
            --unit="miku-ingress-core-lab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --property=CPUQuota=100% --property=MemoryMax=384M --property=MemorySwapMax=0 --property=TasksMax=64 \
            /usr/bin/unshare --net /bin/sh -c '
              /usr/sbin/ip link set lo up
              /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups --no-new-privs \
                /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C LC_ALL=C \
                MIKU_GATE_INGRESS_TEST=1 MIKU_GATE_XRAY="$1/xray" MIKU_GATE_SINGBOX="$1/sing-box" GOMAXPROCS=1 GOMEMLIMIT=96MiB \
                "$1/ingress.test" -test.v -test.run "^TestLinux(IngressCoreRouting|ManagedCoreTemplates)$" -test.timeout=180s &&
              /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups --no-new-privs \
                /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C LC_ALL=C \
                MIKU_GATE_INGRESS_TEST=1 MIKU_GATE_XRAY="$1/xray" MIKU_GATE_SINGBOX="$1/sing-box" GOMAXPROCS=1 GOMEMLIMIT=96MiB \
                "$1/core-runtime.test" -test.v -test.run "^TestLinuxManagedNativeRuntime$" -test.timeout=90s
            ' sh "$stage" 2>&1 | tee .cache/ingress-lab/result.txt
      - name: Save only bounded assertions and source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingress-core-result
          path: .cache/ingress-lab/result.txt
          if-no-files-found: warn
          retention-days: 14
